spring.application.name=madnessevents

# Link to database configuration: http://localhost:8080/h2-console
# H2 database
spring.datasource.url=jdbc:h2:mem:madnesseventsdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=ajmal
spring.datasource.password=admin123

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html

# if want to save the database in a file
# spring.datasource.url=jdbc:h2:file:./data/madnessevents